<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>8 Box</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent;
      }

      body {
        background: transparent;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: max-content;
        gap: 10px;
      }

      .boxes-row {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .outer {
        /* background: #333; */
        padding: 40px;
        border: 1px solid #666;
      }

      .outer > div {
        background: #333;
        padding: 0px 10px 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .outer2 {
        /* background: white; */
        padding: 40px;
        border: 1px solid #666;
      }

      .outer2 > div {
        background: white;
        padding: 0px 10px 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-color: #333;
      }

      .outer2 .number {
        color: #333;
      }

      #outer7,
      #outer8,
      #outer9,
      #outer10,
      #outer11,
      #outer12,
      #outer13,
      #outer14,
      #outer15,
      #outer16,
      #outer17,
      #outer18,
      #outer19,
      #outer20,
      #outer21,
      #outer22,
      #outer23 {
        padding: 40px;
        border: 0;
        background: transparent;
      }

      #outer7 > div,
      #outer8 > div,
      #outer9 > div,
      #outer10 > div,
      #outer11 > div,
      #outer12 > div,
      #outer13 > div,
      #outer14 > div,
      #outer15 > div,
      #outer16 > div,
      #outer17 > div,
      #outer18 > div,
      #outer19 > div,
      #outer20 > div,
      #outer21 > div,
      #outer22 > div,
      #outer23 > div {
        background: transparent !important;
      }

      .no-border {
        border: 0px solid transparent;
        background: transparent !important;
      }

      .box {
        border: 10px solid white;
      }

      .box2 {
        border: 20px solid white;
      }

      .box3 {
        border: 30px solid white;
      }

      .number {
        color: white;
        font-family: 'Oswald', sans-serif;
        font-weight: 500;
        font-size: 200px;
        line-height: 1;
        /* transform: scaleX(0.8); */
      }

      .effect-blur > div {
        filter: blur(1.6px);
      }

      .effect-noise > div {
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.08),
            rgba(255, 255, 255, 0.08)
          ),
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.1) 0px,
            rgba(255, 255, 255, 0.1) 2px,
            transparent 2px,
            transparent 6px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.08) 0px,
            rgba(0, 0, 0, 0.08) 1px,
            transparent 1px,
            transparent 5px
          );
      }

      .effect-low-contrast > div {
        filter: contrast(0.7) brightness(1.08);
      }

      .effect-rotate > div {
        transform: rotate(-2.5deg);
        transform-origin: center;
      }

      .effect-perspective > div {
        transform: skew(-10deg, -2deg);
        transform-origin: center;
      }

      .effect-artifacts > div {
        filter: contrast(0.92) saturate(0.9);
        background-image: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.06) 25%,
          transparent 25%,
          transparent 50%,
          rgba(255, 255, 255, 0.06) 50%,
          rgba(255, 255, 255, 0.06) 75%,
          transparent 75%,
          transparent
        );
        background-size: 10px 10px;
      }

      .effect-strong-blur > div {
        filter: blur(2.8px) contrast(0.9);
      }

      .effect-shadow > div {
        box-shadow: inset 18px -10px 25px rgba(0, 0, 0, 0.35),
          inset -8px 6px 18px rgba(255, 255, 255, 0.12);
      }

      .effect-uneven-light > div {
        background-image: radial-gradient(
            circle at 25% 30%,
            rgba(255, 255, 255, 0.28),
            transparent 45%
          ),
          linear-gradient(115deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.18));
      }

      .effect-crop > div {
        overflow: hidden;
      }

      .effect-crop > div .number {
        transform: translateX(-8px) translateY(4px) scale(1.02);
      }

      .effect-scale > div .number {
        transform: scaleX(0.86) scaleY(1.08);
      }

      .effect-occlusion > div {
        position: relative;
        overflow: hidden;
      }

      .effect-occlusion > div::after {
        content: '';
        position: absolute;
        left: 38%;
        top: -10%;
        width: 16px;
        height: 120%;
        background: rgba(70, 70, 70, 0.55);
        transform: rotate(4deg);
      }

      .effect-dirty > div {
        background-image: radial-gradient(
            circle at 20% 25%,
            rgba(160, 120, 80, 0.22) 0 10px,
            transparent 12px
          ),
          radial-gradient(
            circle at 72% 58%,
            rgba(90, 70, 40, 0.18) 0 8px,
            transparent 10px
          ),
          linear-gradient(rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.08));
      }

      .effect-motion > div {
        filter: blur(0.8px);
      }

      .effect-motion > div .number {
        display: inline-block;
        transform: skewX(-10deg) translateX(-4px);
      }

      .effect-glare > div {
        background-image: linear-gradient(
          115deg,
          transparent 28%,
          rgba(255, 255, 255, 0.3) 47%,
          transparent 62%
        );
      }

      .save-btn {
        margin: 20px 0;
        padding: 14px 36px;
        font-size: 18px;
        font-weight: 600;
        color: #fff;
        background: #2563eb;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .save-btn:hover {
        background: #1d4ed8;
      }
      .save-btn:active {
        background: #1e40af;
      }
    </style>
  </head>

  <body>
    <div class="boxes-row">
      <div class="outer" id="outer1">
        <div class="box">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer" id="outer2">
        <div class="box2">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer" id="outer3">
        <div class="box3">
          <div class="number">0</div>
        </div>
      </div>
    </div>
    <div class="boxes-row">
      <div class="outer2" id="outer4">
        <div class="box">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer2" id="outer5">
        <div class="box2">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer2" id="outer6">
        <div class="box3">
          <div class="number">0</div>
        </div>
      </div>
    </div>
    <div class="boxes-row">
      <div class="outer" id="outer7">
        <div class="no-border">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer2" id="outer8">
        <div class="no-border">
          <div class="number">0</div>
        </div>
      </div>
    </div>
    <div class="boxes-row">
      <div class="outer effect-blur" id="outer9">
        <div class="box">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer effect-noise" id="outer10">
        <div class="box2">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer2 effect-low-contrast" id="outer11">
        <div class="box3">
          <div class="number">0</div>
        </div>
      </div>
    </div>
    <div class="boxes-row">
      <div class="outer effect-rotate" id="outer12">
        <div class="box">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer2 effect-perspective" id="outer13">
        <div class="box2">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer effect-artifacts" id="outer14">
        <div class="no-border">
          <div class="number">0</div>
        </div>
      </div>
    </div>
    <div class="boxes-row">
      <div class="outer effect-strong-blur" id="outer15">
        <div class="box">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer effect-shadow" id="outer16">
        <div class="box2">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer2 effect-uneven-light" id="outer17">
        <div class="box3">
          <div class="number">0</div>
        </div>
      </div>
    </div>
    <div class="boxes-row">
      <div class="outer effect-crop" id="outer18">
        <div class="box">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer2 effect-scale" id="outer19">
        <div class="box2">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer effect-occlusion" id="outer20">
        <div class="box3">
          <div class="number">0</div>
        </div>
      </div>
    </div>
    <div class="boxes-row">
      <div class="outer2 effect-dirty" id="outer21">
        <div class="box">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer effect-motion" id="outer22">
        <div class="box2">
          <div class="number">0</div>
        </div>
      </div>
      <div class="outer effect-glare" id="outer23">
        <div class="box3">
          <div class="number">0</div>
        </div>
      </div>
    </div>

    <button class="save-btn" onclick="saveAll()">Сохранить как картинки</button>

    <script>
      function saveElement(el, filename) {
        return html2canvas(el, { backgroundColor: null, scale: 2 }).then(
          (canvas) => {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
          }
        );
      }

      function setAllNumbers(digit) {
        document.querySelectorAll('.number').forEach((el) => {
          el.textContent = digit;
        });
      }

      async function saveAll() {
        const outers = [
          '#outer1',
          '#outer2',
          '#outer3',
          '#outer4',
          '#outer5',
          '#outer6',
          '#outer7',
          '#outer8',
          '#outer9',
          '#outer10',
          '#outer11',
          '#outer12',
          '#outer13',
          '#outer14',
          '#outer15',
          '#outer16',
          '#outer17',
          '#outer18',
          '#outer19',
          '#outer20',
          '#outer21',
          '#outer22',
          '#outer23',
        ];

        for (let digit = 0; digit <= 9; digit++) {
          setAllNumbers(digit);
          await new Promise((r) => setTimeout(r, 50));

          for (let i = 0; i < outers.length; i++) {
            const el = document.querySelector(outers[i] + ' div');
            const suffix = String(i + 1).padStart(3, '0');
            await saveElement(el, `${digit}_${suffix}.png`);
            await new Promise((r) => setTimeout(r, 50));
          }
        }

        setAllNumbers(0);
      }
    </script>
  </body>
</html>
